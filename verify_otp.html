<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | Plexus Electro CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm border-0 p-4" style="width: 400px; border-radius: 12px;">
        <h3 class="fw-bold mb-2 text-center text-dark">Email Verification</h3>
        <p class="text-muted text-center mb-4 small">Enter the 6-digit verification code sent to your email (check your terminal console).</p>
        
        {% if error %}
            <div class="alert alert-danger py-2 small text-center">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="otp" class="form-label fw-semibold small text-secondary">6-Digit OTP Code</label>
                <input type="text" name="otp" id="otp" class="form-control text-center fs-4" maxlength="6" required placeholder="------" autocomplete="off">
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Verify & Complete Account</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="{% url 'register' %}" class="small text-decoration-none text-secondary">Back to Registration</a>
        </div>
    </div>

</body>
</html>

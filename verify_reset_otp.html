<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Reset OTP | Plexus Electro CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm border-0 p-4" style="width: 400px; border-radius: 12px;">
        <h3 class="fw-bold mb-2 text-center text-dark">Verify OTP</h3>
        <p class="text-muted text-center mb-4 small">Enter the 6-digit code sent to your email.</p>
        
        {% if error %}
            <div class="alert alert-danger p-2 small mb-3">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3 text-center">
                <input type="text" name="otp" class="form-control text-center fs-4 tracking-widest" maxlength="6" placeholder="------" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Verify OTP</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="{% url 'forgot_password' %}" class="small text-decoration-none text-muted">Resend OTP / Back</a>
        </div>
    </div>

</body>
</html>

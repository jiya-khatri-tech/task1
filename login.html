<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Office Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm border-0 p-4" style="width: 400px; border-radius: 12px;">
        <h3 class="fw-bold mb-2 text-center text-dark">Welcome Back</h3>
        <p class="text-muted text-center mb-4 small">Sign in to access the office portal</p>
        
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            
            <div class="mb-3">
                <label for="id_username" class="form-label fw-semibold small text-secondary">Username</label>
                {{ form.username }}
            </div>
            
            <div class="mb-3">
                <label for="id_password" class="form-label fw-semibold small text-secondary">Password</label>
                {{ form.password }}
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="{% url 'register' %}" class="small text-decoration-none me-3">Create Account</a>
            <a href="{% url 'password_reset' %}" class="small text-decoration-none text-muted">Forgot Password?</a>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Plexus Electro CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm border-0 p-4" style="width: 400px; border-radius: 12px;">
        <h3 class="fw-bold mb-1 text-center text-dark">Plexus Electro CRM</h3>
        <p class="text-muted text-center mb-4 small">Sign in to your account</p>

        {% if error %}
            <div class="alert alert-danger p-2 small mb-3">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Sign In</button>
        </form>

        <div class="d-flex justify-content-between small">
            <a href="{% url 'register' %}" class="text-decoration-none">Create Account</a>
            <a href="{% url 'forgot_password' %}" class="text-decoration-none">Forgot Password?</a>
        </div>
    </div>

</body>
</html>

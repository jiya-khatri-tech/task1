<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Deletion | Plexus Electro CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0 rounded-3 text-center p-4">
                    <div class="card-body">
                        <div class="text-danger fs-1 mb-3">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                        </div>
                        <h3 class="fw-bold text-dark mb-2">Confirm Deletion</h3>
                        <p class="text-muted mb-4">
                            Are you sure you want to delete employee <strong>{{ employee.name }}</strong> ({{ employee.email }})? This action cannot be undone.
                        </p>

                        <form method="POST">
                            {% csrf_token %}
                            <div class="d-flex justify-content-center gap-2">
                                <a href="{% url 'employee_list' %}" class="btn btn-secondary px-4 fw-semibold">Cancel</a>
                                <button type="submit" class="btn btn-danger px-4 fw-semibold">Yes, Delete</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

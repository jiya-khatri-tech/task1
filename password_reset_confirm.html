<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Plexus Electro CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm border-0 p-4" style="width: 400px; border-radius: 12px;">
        <h3 class="fw-bold mb-1 text-center text-dark">Set New Password</h3>
        <p class="text-muted text-center mb-4 small">Please enter your new password twice.</p>

        {% if error %}
            <div class="alert alert-danger p-2 small mb-3">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">New Password</label>
                <input type="password" name="new_password" class="form-control" placeholder="At least 6 characters" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter new password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Change My Password</button>
        </form>

        <div class="text-center small">
            <a href="{% url 'login' %}" class="text-decoration-none">Back to Login</a>
        </div>
    </div>

</body>
</html>

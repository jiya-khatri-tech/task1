<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Product | Plexus Electro CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 text-center">
                        <h4 class="fw-bold text-danger mb-2">Confirm Delete</h4>
                        <p class="text-muted mb-4">
                            Are you sure you want to delete <strong>{{ product.name }}</strong> ({{ product.code }})?
                        </p>
                        <form method="POST" class="d-flex justify-content-center gap-2">
                            {% csrf_token %}
                            <a href="{% url 'product_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                            <button type="submit" class="btn btn-danger px-4 fw-semibold">Yes, Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

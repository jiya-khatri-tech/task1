<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Category | Plexus Electro CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0 rounded-3 text-center p-4">
                    <div class="card-body">
                        <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3"></i>
                        <h4 class="fw-bold text-dark mb-2">Delete Category?</h4>
                        <p class="text-muted mb-4">Are you sure you want to delete <strong>"{{ category.name }}"</strong>? This action cannot be undone.</p>

                        <form method="POST">
                            {% csrf_token %}
                            <div class="d-flex justify-content-center gap-2">
                                <a href="{% url 'category_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                                <button type="submit" class="btn btn-danger px-4 fw-semibold">Yes, Delete</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

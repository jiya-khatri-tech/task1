<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee | Plexus Electro CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4">
                        <h3 class="fw-bold text-dark mb-1">Edit Employee Profile</h3>
                        <p class="text-muted small mb-4">Modify details for {{ employee.name }}</p>

                        <!-- Django Messages Framework Notifications -->
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-sm mb-3" role="alert">
                                    <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill{% else %}bi-exclamation-triangle-fill{% endif %} me-2"></i>
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <!-- Pre-populated Employee Edit Form -->
                        <form method="POST">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" name="name" class="form-control" value="{{ employee.name }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" name="email" class="form-control" value="{{ employee.email }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Department</label>
                                <input type="text" name="department" class="form-control" value="{{ employee.department|default:'' }}">
                            </div>

                            <!-- Role Dropdown Options (Auto-selects current role) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Role / Designation</label>
                                <select name="role" class="form-select" required>
                                    <option value="" disabled>Select employee role</option>
                                    <option value="Manager" {% if employee.role == "Manager" %}selected{% endif %}>Manager</option>
                                    <option value="Electro Engineer" {% if employee.role == "Electro Engineer" %}selected{% endif %}>Electro Engineer</option>
                                    <option value="Support Staff" {% if employee.role == "Support Staff" %}selected{% endif %}>Support Staff</option>
                                    <option value="Sales Representative" {% if employee.role == "Sales Representative" %}selected{% endif %}>Sales Representative</option>
                                    <option value="Technician" {% if employee.role == "Technician" %}selected{% endif %}>Technician</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="text" name="phone" class="form-control" value="{{ employee.phone|default:'' }}">
                            </div>

                            <!-- Active Status Toggle Switch (Pre-checked if active) -->
                            <div class="mb-4 form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="is_active" name="is_active" {% if employee.is_active %}checked{% endif %}>
                                <label class="form-check-label fw-semibold" for="is_active">Active Account Status</label>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="{% url 'employee_list' %}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left me-1"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                    <i class="bi bi-check-circle-fill me-1"></i> Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

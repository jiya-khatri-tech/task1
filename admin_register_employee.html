<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Employee | Plexus Electro CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm border-0 p-4" style="width: 450px; border-radius: 12px;">
        <h3 class="fw-bold mb-1 text-center text-dark">Register Employee</h3>
        <p class="text-muted text-center mb-4 small">Admin Portal - Add New Staff Member</p>

        {% if error %}
            <div class="alert alert-danger p-2 small mb-3">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="john@plexuselectro.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Initial Password</label>
                <input type="password" name="password" class="form-control" placeholder="Secure temporary password" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small text-secondary">Department</label>
                    <input type="text" name="department" class="form-control" placeholder="Sales / Tech">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small text-secondary">Role</label>
                    <input type="text" name="role" class="form-control" placeholder="Manager">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Phone Number</label>
                <input type="text" name="phone" class="form-control" placeholder="+1234567890">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Register Employee</button>
        </form>

        <div class="text-center small">
            <a href="{% url 'dashboard' %}" class="text-decoration-none">Back to Dashboard</a>
        </div>
    </div>

</body>
</html>

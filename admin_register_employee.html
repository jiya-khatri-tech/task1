<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Employee | Plexus Electro CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4">
                        <h3 class="fw-bold text-dark mb-1">Register New Employee</h3>
                        <p class="text-muted small mb-4">Plexus Electro CRM - Staff Onboarding</p>

                        <!-- Django Messages Framework Notifications -->
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-sm mb-3" role="alert">
                                    <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill{% else %}bi-exclamation-triangle-fill{% endif %} me-2"></i>
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <!-- Employee Registration Form -->
                        <form method="POST">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" name="name" class="form-control" placeholder="Enter full name" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" name="email" class="form-control" placeholder="name@plexuselectro.com" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Temporary Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Enter secure password" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Department</label>
                                <input type="text" name="department" class="form-control" placeholder="e.g. Engineering, Sales">
                            </div>

                            <!-- Role Dropdown Options -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Role / Designation</label>
                                <select name="role" class="form-select" required>
                                    <option value="" disabled selected>Select employee role</option>
                                    <option value="Manager">Manager</option>
                                    <option value="Electro Engineer">Electro Engineer</option>
                                    <option value="Support Staff">Support Staff</option>
                                    <option value="Sales Representative">Sales Representative</option>
                                    <option value="Technician">Technician</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="text" name="phone" class="form-control" placeholder="+1 (555) 000-0000">
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="{% url 'employee_list' %}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left me-1"></i> Back to Directory
                                </a>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                    <i class="bi bi-person-plus-fill me-1"></i> Register Employee
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
